<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go GUI Timeline accessibility test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #181a1f; }
    #go-gui-canvas { display: block; width: 100%; height: 100%; }
    #status { position: fixed; inset: 1rem auto auto 1rem; color: white; font: 16px sans-serif; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">Loading timeline…</div>
  <canvas id="go-gui-canvas" aria-hidden="true"></canvas>
  <script src="wasm_exec.js"></script>
  <script>
    const status = document.getElementById("status");
    const canvas = document.getElementById("go-gui-canvas");
    const go = new Go();

    // Go GUI builds a screen-reader-only ARIA tree beside its visual canvas.
    // Its browser backend listens for keys on the document, so the semantic
    // root can safely hold DOM/Narrator focus while Go GUI retains its own
    // internal focus for the active control.
    let accessibilityRoot;
    const connectAccessibilityTree = () => {
      if (!accessibilityRoot) {
        accessibilityRoot = document.querySelector(
          'body > div[role="application"][aria-label="go-gui"]'
        );
        if (accessibilityRoot) {
          accessibilityRoot.id = "timeline-accessibility-tree";
          accessibilityRoot.tabIndex = 0;
          accessibilityRoot.setAttribute("aria-label", "Timeline application");
          canvas.tabIndex = -1;
        }
      }
    };
    new MutationObserver(connectAccessibilityTree).observe(document.body, {
      attributes: true,
      childList: true,
      subtree: true,
      attributeFilter: ["aria-activedescendant"]
    });

    WebAssembly.instantiateStreaming(fetch("timeline.wasm"), go.importObject)
      .then((result) => {
        status.remove();
        return go.run(result.instance);
      })
      .catch((error) => {
        console.error(error);
        status.textContent = "Could not start the timeline: " + error;
      });
  </script>
</body>
</html>
